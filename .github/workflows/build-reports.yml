name: PR Build Reports

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compressed-size:
    name: Compressed size comparison
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Compare compressed JS, CSS, and HTML
        id: sizes
        uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9 # v2
        with:
          pattern: dist/**/*.{js,css,html}
          compression: gzip
          strip-hash: '\.([A-Za-z0-9_-]{8})(?=\.(?:js|css)$)'
          omit-unchanged: true
          minimum-change-threshold: 100
          sort-by: Change:desc
        env:
          PUBLIC_SNOW_FALL_ENABLED: "false"

      - name: Save report in the job summary
        env:
          REPORT: ${{ steps.sizes.outputs.comment-body }}
        run: |
          printf '%s\n' "$REPORT" >> "$GITHUB_STEP_SUMMARY"

  bundle-stats:
    name: BundleStats comparison
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: head/.nvmrc
          cache: npm
          cache-dependency-path: |
            head/package-lock.json
            base/package-lock.json

      - name: Install PR dependencies
        working-directory: head
        run: npm ci

      - name: Install base dependencies
        working-directory: base
        run: npm ci

      - name: Build both client bundles with stats
        env:
          PUBLIC_SNOW_FALL_ENABLED: "false"
        run: |
          node head/scripts/build-bundle-stats.ts base "$RUNNER_TEMP/base-stats.json"
          node head/scripts/build-bundle-stats.ts head "$RUNNER_TEMP/head-stats.json"

      - name: Generate BundleStats report
        run: |
          head/node_modules/.bin/bundle-stats --no-compare --html --json \
            --out-dir "$RUNNER_TEMP/bundle-stats" \
            "$RUNNER_TEMP/head-stats.json" "$RUNNER_TEMP/base-stats.json"

      - name: Upload BundleStats report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bundle-stats-comparison
          path: ${{ runner.temp }}/bundle-stats/
          if-no-files-found: error
          retention-days: 14

      - name: Explain the report
        run: |
          echo 'Download **bundle-stats-comparison** from this run and open **bundle-stats.html** to compare the PR client bundle with its base. Compressed file sizes, including HTML pages, are reported separately by **Compressed size comparison**.' >> "$GITHUB_STEP_SUMMARY"
