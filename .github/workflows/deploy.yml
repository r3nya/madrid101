name: CI and GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so git-based page dates are correct.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript, TypeScript, and Astro
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Calculate snowfall period
        id: snowfall
        run: |
          month=$(date -u +"%m")
          day=$(date -u +"%d")
          snow_fall="false"
          if [ "$month" = "12" ] && [ "$day" -ge 20 ]; then
            snow_fall="true"
          elif [ "$month" = "01" ] && [ "$day" -le 15 ]; then
            snow_fall="true"
          fi
          echo "enabled=$snow_fall" >> "$GITHUB_OUTPUT"

      - name: Build site and validate links
        run: npm run build
        env:
          PUBLIC_SNOW_FALL_ENABLED: ${{ steps.snowfall.outputs.enabled }}

      - name: Validate generated SEO metadata
        run: npm run test:seo

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
