name: Biome Migrate on Dependabot

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: |
          BIOME_VERSION=$(node -p "require('./package.json').devDependencies['@biomejs/biome']")
          npx --yes "@biomejs/biome@${BIOME_VERSION}" migrate --write

      - run: |
          if git diff --quiet; then
            echo "No changes from migration"
          else
            git config user.name "Biome Migrate Bot"
            git config user.email "hola-madrid101@pm.me"
            git add .
            git commit -m "chore: run biome migrate after update"
            git push
          fi
