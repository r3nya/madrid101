name: Biome Migrate on Dependabot

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: |
          BIOME_VERSION=$(node -p "require('./package.json').devDependencies['@biomejs/biome']")
          npx --yes "@biomejs/biome@${BIOME_VERSION}" migrate --write

      - run: |
          if git diff --quiet; then
            echo "No changes from migration"
          else
            git config user.name "Biome Migrate Bot"
            git config user.email "hola-madrid101@pm.me"
            git add .
            git commit -m "chore: run biome migrate after update"
            git push
          fi
